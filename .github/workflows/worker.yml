name: Flexible Storage Worker

on:
  workflow_dispatch:
    inputs:
      batch_data:
        description: 'Dữ liệu JSON chứa index và prompt'
        required: true
      storage_repo:
        description: 'Repo lưu trữ ảnh (ví dụ: username/repo-name)'
        required: true
      gh_token:
        description: 'Token có quyền ghi vào storage repo'
        required: true

jobs:
  run-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests websocket-client

      - name: Run Processor
        # Truyền JSON vào script Python xử lý
        run: |
          python processor.py '${{ github.event.inputs.batch_data }}'

      - name: Clone and Push to Storage Repo
        env:
          TARGET_REPO: ${{ github.event.inputs.storage_repo }}
          AUTH_TOKEN: ${{ github.event.inputs.gh_token }}
        run: |
          git config --global user.name "Github Action Bot"
          git config --global user.email "actions@github.com"
          
          # Clone repo đích vào thư mục tạm
          git clone https://$AUTH_TOKEN@github.com/$TARGET_REPO.git target_storage
          
          # Tạo thư mục Images nếu chưa có và copy ảnh sang
          mkdir -p target_storage/Images
          cp -r Images/* target_storage/Images/
          
          cd target_storage
          git add .
          
          # Chiến lược Retry Push để tránh xung đột khi nhiều Action chạy song song
          for i in {1..15}; do
            if git commit -m "Worker auto-saved images"; then
              git pull --rebase origin main
              if git push origin main; then
                echo "✅ Đã đẩy ảnh sang $TARGET_REPO thành công!"
                exit 0
              fi
            else
              echo "Không có thay đổi mới để commit."
              exit 0
            fi
            echo "⚠️ Xung đột xảy ra, đang thử lại sau $((RANDOM % 15 + 5)) giây..."
            sleep $((RANDOM % 15 + 5))
          done
