name: Flexible Storage Worker

on:
  workflow_dispatch:
    inputs:
      batch_data:
        description: 'Dữ liệu JSON chứa index và prompt'
        required: true
      storage_repo:
        description: 'Repo lưu trữ ảnh (ví dụ: username/repo-name)'
        required: true
      gh_token:
        description: 'Token có quyền ghi vào storage repo'
        required: true

jobs:
  run-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests websocket-client

      - name: Run Processor
        shell: bash
        run: |
          # Sử dụng 'EOF' để bọc dữ liệu giúp tránh lỗi syntax shell khi gặp dấu ngoặc () hoặc nháy kép ""
          cat << 'EOF' > data.json
          ${{ github.event.inputs.batch_data }}
          EOF
          
          # Thực thi python và đọc dữ liệu từ file json vừa tạo
          python processor.py data.json

      - name: Clone and Push to Storage Repo
        env:
          TARGET_REPO: ${{ github.event.inputs.storage_repo }}
          AUTH_TOKEN: ${{ github.event.inputs.gh_token }}
        run: |
          git config --global user.name "Github Action Bot"
          git config --global user.email "actions@github.com"
          
          # Clone repo đích
          git clone https://$AUTH_TOKEN@github.com/$TARGET_REPO.git target_storage
          
          # Tạo thư mục và copy ảnh
          mkdir -p target_storage/Images
          if [ -d "Images" ] && [ "$(ls -A Images)" ]; then
            cp -r Images/* target_storage/Images/
          else
            echo "Không có ảnh nào được tạo ra."
            exit 0
          fi
          
          cd target_storage
          git add .
          
          # Chiến lược Push an toàn với Rebase (thử lại 15 lần)
          for i in {1..15}; do
            if git commit -m "Worker auto-saved images"; then
              git pull --rebase origin main
              if git push origin main; then
                echo "✅ Đã đẩy ảnh sang $TARGET_REPO thành công!"
                exit 0
              fi
            else
              echo "Không có thay đổi mới."
              exit 0
            fi
            echo "⚠️ Đang thử lại sau xung đột..."
            sleep $((RANDOM % 15 + 5))
          done
